<th:block th:fragment="layout(title, asideTitle, asideItems, content)">
    <!DOCTYPE html>
    <html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/head :: head(${title})"></head>
    <body class="d-flex flex-column min-vh-100">
    <aside class="col-md-2 p-0" th:replace="fragments/aside :: aside(
        title=${asideTitle},
        items=${asideItems},
        classes='col-md-2 bg-light',
        style='height:100vh; overflow:auto;')"></aside>
    <div class="d-flex flex-column flex-grow-1">
        <header th:replace="fragments/header :: header"></header>
        <main class="flex-grow-1 container my-4">
            <div th:replace="${content}"></div>
        </main>
        <footer th:replace="fragments/footer :: footer(${year})"></footer>
    </div>
    <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </body>
    </html>
</th:block>
