<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-card">
    <h2 class="text-center mb-4">Iniciar Sesión</h2>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">CURP</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu CURP" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">Credenciales incorrectas</div>
        <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión correctamente</div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
</div>
</body>
</html>
