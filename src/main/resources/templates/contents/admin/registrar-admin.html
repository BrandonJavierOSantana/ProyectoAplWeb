<th:block th:fragment="content">
  <div class="container mt-4">
    <h1 class="mb-4">Registrar Administrador</h1>
    <form th:action="@{/admin/registrar-admin}"
          th:object="${persona}"
          method="post"
          class="row justify-content-center g-3">

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="col-md-5">
        <label for="curp" class="form-label">CURP</label>
        <input id="curp" th:field="*{curp}" class="form-control"
               pattern="[A-Z]{4}[0-9]{6}[A-Z]{6}[A-Z0-9]{2}"
               maxlength="18" placeholder="CURP" required />
      </div>
      <div class="col-md-5">
        <label for="nombre" class="form-label">Nombre(s)</label>
        <input id="nombre" th:field="*{nombre}" class="form-control"
               pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{1,50}" maxlength="50" placeholder="Nombre(s)" required />
      </div>
      <div class="col-md-5">
        <label for="apellidoPaterno" class="form-label">Apellido paterno</label>
        <input id="apellidoPaterno" th:field="*{apellidoPaterno}" class="form-control"
               pattern="[A-Za-zÁÉÍÓÚÑáéíóúñ ]{1,20}" maxlength="20" placeholder="Apellido paterno" required />
      </div>
      <div class="col-md-5">
        <label for="apellidoMaterno" class="form-label">Apellido materno</label>
        <input id="apellidoMaterno" th:field="*{apellidoMaterno}" class="form-control"
               pattern="[A-Za-zÁÉÍÓÚÑáéíóúñ ]{1,20}" maxlength="20" placeholder="Apellido materno" required />
      </div>
      <div class="col-md-5">
        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
        <input id="fechaNacimiento" th:field="*{fechaNacimiento}" class="form-control" type="date"
               min="1903-01-01" max="2025-12-31" required />
      </div>
      <div class="col-md-5">
        <label for="sexo" class="form-label">Sexo</label>
        <select id="sexo" th:field="*{sexo}" class="form-select" required>
          <option value="">Seleccione el sexo</option>
          <option value="M">M</option>
          <option value="F">F</option>
        </select>
      </div>
      <div class="col-md-5">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input id="contrasena" th:field="*{contrasena}" type="password" class="form-control"
               minlength="8" maxlength="255" placeholder="••••••••" required />
      </div>

      <div class="col-12 text-center mt-3">
        <button type="submit" class="btn btn-primary">Registrar administrador</button>
      </div>
    </form>
  </div>
</th:block>
